title: La skill por bloques
note: cuatro columnas; un bloque que abarca varias es tan ancho como ellas, y el hueco de la fila 2 es un space
nests:
  ledger: {title: ledger/, color: yellow}
  scripts: {title: scripts/, color: grape}
blocks:
  skill: {label: SKILL.md, at: [0, 0], columns: 4}
  sins: {label: sins.yaml, at: [0, 1], nest: ledger}
  pieces_yaml: {label: pieces.yaml, at: [1, 1], nest: ledger}
  types: {label: types.yaml, at: [2, 1], nest: ledger}
  pieces_py: {label: pieces.py, at: [0, 2], nest: scripts}
  lint: {label: lint.py, at: [1, 2], nest: scripts}
  write: {label: write.py, at: [2, 2], nest: scripts}
  fetch: {label: fetch.py, at: [3, 2], nest: scripts}
  pieces_dir: {label: pieces/, at: [0, 3], color: teal}
  checks: {label: checks/, at: [1, 3], color: teal}
  excalidraw: {label: Excalidraw+, at: [2, 3], columns: 2, external: true}
edges:
  - [skill, ledger, remite a]
  - [pieces_py, pieces_dir, importa]
  - [lint, checks, ejecuta]
  - [write, excalidraw, escribe]
  - [fetch, excalidraw, descarga]
